notification.dbPath.failed.content={0}. 이전 데이터베이스를 계속 사용합니다. 새 위치에 쓸 수 있는지와 여유 공간을 확인한 뒤 다시 시도하세요.
notification.dbPath.targetExists.content={0} 파일이 이미 있어 복사하지 않았습니다. 이전 데이터베이스를 계속 사용합니다. 그 파일을 옮기거나 지우거나 다른 위치를 고른 뒤 다시 시도하세요.
notification.dbPath.busy.content=다른 데이터베이스 경로 변경이 아직 진행 중입니다. 끝난 뒤 다시 적용하세요.
notification.dbPath.unusableTarget.content={0} 파일을 JNote 데이터베이스로 열 수 없습니다. 다른 종류의 파일이거나, 손상됐거나, 더 새로운 JNote 버전에서 만든 파일일 수 있습니다. 이전 데이터베이스를 계속 사용합니다. JNote 데이터베이스 파일을 고르거나, 파일이 없는 경로를 입력해 현재 데이터베이스를 그곳으로 복사하세요.
notification.dbPath.closeFailed.title=이전 데이터베이스를 닫지 못했습니다
notification.dbPath.closeFailed.content=JNote는 이제 {0}을(를) 사용하지만 이전 데이터베이스를 닫지 못했습니다: {1}. 이전 파일의 잠금을 풀려면 IDE를 다시 시작하세요.
task.dbPath.switching=JNote 데이터베이스 전환 중
